<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TabGuard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:400px;max-height:600px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       background:#0a0e14;color:#e6edf3;font-size:13px;line-height:1.5;overflow-y:auto}
  .header{padding:14px 16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:15px;font-weight:600}
  .badge{font-size:10px;padding:2px 8px;border-radius:999px;background:#1a2130;color:#7ee787;border:1px solid #30363d}
  .badge.pro{background:#4f9cf9;color:#fff;border-color:#4f9cf9}
  .actions{padding:12px 16px;border-bottom:1px solid #30363d;display:flex;gap:8px}
  .btn{flex:1;padding:10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s}
  .btn-primary{background:#4f9cf9;color:#fff}
  .btn-primary:hover{background:#3d7fd4}
  .btn-secondary{background:#1a2130;color:#e6edf3;border:1px solid #30363d}
  .btn-secondary:hover{background:#131820}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .list{padding:8px 16px}
  .session{padding:10px;margin-bottom:8px;background:#131820;border:1px solid #30363d;border-radius:6px}
  .session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
  .session-label{font-weight:600;font-size:12px;word-break:break-word;flex:1}
  .session-meta{font-size:10.5px;color:#8b98a8;margin-bottom:6px}
  .verified{color:#7ee787}
  .unverified{color:#d29922}
  .failed{color:#f85149}
  .session-actions{display:flex;gap:4px;flex-wrap:wrap}
  .mini{padding:4px 8px;font-size:10.5px;border-radius:4px;border:1px solid #30363d;background:#0a0e14;color:#e6edf3;cursor:pointer}
  .mini:hover{border-color:#4f9cf9}
  .mini.danger:hover{border-color:#f85149;color:#f85149}
  .empty{text-align:center;padding:32px 16px;color:#8b98a8;font-size:12px}
  .toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:6px;
         background:#7ee787;color:#0a0e14;font-size:12px;font-weight:600;display:none;z-index:100}
  .toast.error{background:#f85149;color:#fff}
  .footer{padding:10px 16px;border-top:1px solid #30363d;font-size:10.5px;color:#8b98a8;text-align:center}
            .hidden{display:none !important}
</style>
</head>
<body>

<div class="header">
  <h1>TabGuard</h1>
  <span class="badge" id="plan-badge">Free</span>
</div>

<div class="actions">
  <button class="btn btn-primary" id="btn-save">Save current tabs</button>
  <button class="btn btn-secondary" id="btn-export-all">Export all</button>
</div>

<div class="list" id="list">
  <div class="empty">No saved sessions yet. Click "Save current tabs" to start.</div>
</div>

<div class="footer">Verify before save · Export any time · No lock-in</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
